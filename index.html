<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CFNBI Collaborator Network</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
}

#map {
    width: 100%;
    height: 100vh;
}

.title-box {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;

    background: rgba(20,20,20,0.85);
    color: white;

    padding: 16px 24px;

    border-radius: 14px;

    border: 1px solid rgba(42,124,146,0.5);

    backdrop-filter: blur(10px);

    text-align: center;
}

.title-box h1{
    margin:0;
    font-size:26px;
    color:#2A7C92;
}

.title-box p{
    margin:6px 0 0 0;
    color:#ddd;
}

.stats-box {

    position:absolute;
    left:20px;
    top:120px;

    z-index:1000;

    background:rgba(20,20,20,0.85);

    color:white;

    padding:18px;

    border-radius:14px;

    border:1px solid rgba(42,124,146,0.5);

    backdrop-filter: blur(10px);

    width:240px;
}

.stats-box h3{
    margin-top:0;
    color:#2A7C92;
}

.legend {

    position:absolute;
    right:20px;
    bottom:20px;

    z-index:1000;

    background:rgba(20,20,20,0.85);

    color:white;

    padding:18px;

    border-radius:14px;

    border:1px solid rgba(42,124,146,0.5);

    backdrop-filter: blur(10px);
}

.legend h3{
    margin-top:0;
    color:#2A7C92;
}

.dot{
    display:inline-block;
    border-radius:50%;
    margin-right:8px;
}

.low{
    width:10px;
    height:10px;
    background:#A5CDD7;
}

.med{
    width:14px;
    height:14px;
    background:#6BAABC;
}

.high{
    width:18px;
    height:18px;
    background:#2A7C92;
}

</style>

</head>

<body>

<div class="title-box">
    <h1>CFNBI Collaborator Network</h1>
    <p>30 Collaborator Appointments Across Canada and Internationally</p>
</div>

<div class="stats-box">

<h3>Network Summary</h3>

<b>30</b> Collaborator Appointments<br><br>

<b>14</b> Institutions<br><br>

<b>4</b> Countries<br><br>

<b>Hub:</b><br>
University of British Columbia

</div>

<div class="legend">

<h3>Density</h3>

<div><span class="dot high"></span> High Concentration</div><br>

<div><span class="dot med"></span> Moderate Concentration</div><br>

<div><span class="dot low"></span> Individual Collaborator</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView([40,-30],2);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 attribution:'© OpenStreetMap contributors'
}
).addTo(map);

const UBC = [49.2606,-123.2460];

const collaborators = [

["University of British Columbia",14,49.2606,-123.2460,"Canada"],

["McMaster University",2,43.2609,-79.9192,"Canada"],

["Baycrest",2,43.7330,-79.4280,"Canada"],

["University of Saskatchewan",2,52.1332,-106.6700,"Canada"],

["Sunnybrook Research Institute",1,43.7250,-79.3750,"Canada"],

["Lund University",1,55.7047,13.1910,"Sweden"],

["University of Pittsburgh",1,40.4440,-79.9600,"USA"],

["University of Victoria",1,48.4634,-123.3117,"Canada"],

["University of Northern British Columbia",1,53.9171,-122.7497,"Canada"],

["Children's Hospital of Eastern Ontario",1,45.4010,-75.6510,"Canada"],

["Université de Montréal",1,45.5050,-73.6130,"Canada"],

["University of Ottawa",1,45.4236,-75.6970,"Canada"],

["Vancouver Island University",1,49.1639,-123.9697,"Canada"],

["Monash University",1,-37.9100,145.1340,"Australia"]

];

collaborators.forEach(site => {

    const name = site[0];
    const count = site[1];
    const lat = site[2];
    const lng = site[3];
    const country = site[4];

    let radius = 8;
    let color = "#A5CDD7";

    if(count >=10){
        radius = 22;
        color = "#2A7C92";
    }
    else if(count >=2){
        radius = 14;
        color = "#6BAABC";
    }

    if(name === "University of British Columbia"){

        L.circle(
            [lat,lng],
            {
                radius:400000,
                color:"#2A7C92",
                fillColor:"#2A7C92",
                fillOpacity:0.08,
                stroke:false
            }
        ).addTo(map);

    }

    L.circleMarker(
        [lat,lng],
        {
            radius:radius,
            color:color,
            fillColor:color,
            fillOpacity:0.9,
            weight:2
        }
    )
    .addTo(map)
    .bindPopup(
        "<b>" + name + "</b><br>" +
        "Appointments: " + count + "<br>" +
        country
    );


    if(name !== "University of British Columbia"){

        L.polyline(
            [
                UBC,
                [lat,lng]
            ],
            {
                color:"#2A7C92",
                weight:2,
                opacity:0.45
            }
        ).addTo(map);

    }

});

</script>

</body>
</html>
