<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CFNBI Test</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body, #map {
    height: 100%;
    margin: 0;
}
</style>

</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script

var map = L.map('map').setView([49.2827, -123.1207], 4);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

L.marker([49.2827,-123.1207])
.addTo(map)
.bindPopup('CFNBI');

</script>

</body>
</html>
