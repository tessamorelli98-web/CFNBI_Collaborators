<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Test Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
#map {
  height: 100vh;
}
</style>

</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/script>

<script>

var map = L.map('map').setView([49.2827, -123.1207], 4);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

L.marker([49.2827, -123.1207])
.addTo(map)
.bindPopup("CFNBI");

</script>

</body>
</html>
