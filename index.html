<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>CFNBI Test Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    height: 100%;
}

#map {
    width: 100%;
    height: 100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></cript>

<script>

const map = L.map('map').setView([49.2827, -123.1207], 4);

L.tileLayer(
  'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);

L.marker([49.2827, -123.1207])
 .addTo(map)
 .bindPopup('CFNBI');

</script>

</body>
</html>
